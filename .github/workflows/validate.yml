name: Validate

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
  workflow_dispatch:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run timetable parser tests
        run: python -m unittest discover -s tests -v
